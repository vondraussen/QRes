name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: qres-win32
          path: dist/*

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive dist/* qres-win32.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: qres-win32.zip
